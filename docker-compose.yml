services:
  penutx:
    # Swap this for the published image once you push to GHCR, e.g.:
    # image: ghcr.io/YOUR_USERNAME/penutx:latest
    build: .
    container_name: penutx
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - WATCHTOWER_URL=http://watchtower:8080
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:?set a token in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - watchtower
    networks:
      - penutx-net
    labels:
      # Locally built (not pulled from a registry), so Watchtower can't
      # "update" it -- exclude it to avoid pointless failed pull attempts.
      - com.centurylinklabs.watchtower.enable=false

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:?set a token in .env}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_CLEANUP=true
      # Pin to your host's Docker API version if Watchtower crash-loops with
      # "client version too old" — check yours with:
      #   docker version --format '{{.Server.APIVersion}}'
      - DOCKER_API_VERSION=1.55
      # Opt-out mode: every container is managed by default. To exclude a
      # specific container, label it com.centurylinklabs.watchtower.enable=false.
      # (Switch to opt-in instead by adding WATCHTOWER_LABEL_ENABLE=true here
      # and labeling containers =true individually.)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - penutx-net
    labels:
      # Watchtower shouldn't update/restart itself mid-run.
      - com.centurylinklabs.watchtower.enable=false

networks:
  penutx-net:
    driver: bridge
